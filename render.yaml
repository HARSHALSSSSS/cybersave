# Cybersave on Render (Blueprint)
#
# Services:
# - cybersave-api  → NestJS API (already deployed as cybersave-l972)
# - cybersave-web  → Citizen portal (Vite static site)
#
# IMPORTANT: Create a free Postgres on https://neon.tech first for the API,
# then set DATABASE_URL in the Render dashboard.

services:
  - type: web
    name: cybersave-api
    runtime: node
    plan: free
    # Repository root so admin/ is available when building the admin SPA
    rootDir: .
    buildCommand: cd backend && npm ci --include=dev && npx prisma generate && npm run build
    startCommand: cd backend && node scripts/start-render.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: DATABASE_URL
        sync: false
      - key: API_PREFIX
        value: api/v1
      - key: AUTO_SEED
        value: "true"
      - key: CITIZEN_JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: CITIZEN_JWT_EXPIRES_IN
        value: 15m
      - key: ADMIN_JWT_EXPIRES_IN
        value: 15m
      - key: CITIZEN_JWT_AUDIENCE
        value: cybersave-mobile
      - key: ADMIN_JWT_AUDIENCE
        value: cybersave-admin
      - key: CITIZEN_REFRESH_TOKEN_EXPIRES_DAYS
        value: "30"
      - key: ADMIN_REFRESH_TOKEN_EXPIRES_DAYS
        value: "7"
      - key: OTP_EXPIRES_MINUTES
        value: "5"
      - key: OTP_LENGTH
        value: "6"
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_PATH
        value: ./storage
      - key: STORAGE_PUBLIC_BASE_URL
        value: https://api.cybersaveonline.com/api/v1/storage/local
      - key: CORS_ORIGINS
        value: "*"
      - key: SWAGGER_ENABLED
        value: "true"
      - key: SMS_PROVIDER
        value: console
      - key: AUTH_PROVIDER
        value: firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: SKIP_PAYMENT_VERIFICATION
        value: "false"
      - key: BBPS_PROVIDER
        value: mock
      - key: BBPS_CONVENIENCE_FEE_FLAT
        value: "5"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: web
    name: cybersave-admin
    runtime: static
    plan: free
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Legacy builds used base /admin/ — map asset URLs to /assets/*
      - type: rewrite
        source: /admin/assets/*
        destination: /assets/*
      - type: rewrite
        source: /admin/*
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.cybersaveonline.com/api/v1
      - key: VITE_ADMIN_BASE
        value: /

  - type: web
    name: cybersave-web
    runtime: static
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.cybersaveonline.com/api/v1
      - key: VITE_APP_NAME
        value: Cybersave
      - key: VITE_USE_FIREBASE_AUTH
        value: "true"
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
