# Cybersave on Render (Blueprint)
#
# Services:
# - cybersave-api  → NestJS API (already deployed as cybersave-l972)
# - cybersave-web  → Citizen portal (Vite static site)
#
# IMPORTANT: Create a free Postgres on https://neon.tech first for the API,
# then set DATABASE_URL in the Render dashboard.

services:
  - type: web
    name: cybersave-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev so Nest CLI / types are available at build time on Render
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: node scripts/start-render.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: API_PREFIX
        value: api/v1
      - key: AUTO_SEED
        value: "true"
      - key: CITIZEN_JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: CITIZEN_JWT_EXPIRES_IN
        value: 15m
      - key: ADMIN_JWT_EXPIRES_IN
        value: 15m
      - key: CITIZEN_JWT_AUDIENCE
        value: cybersave-mobile
      - key: ADMIN_JWT_AUDIENCE
        value: cybersave-admin
      - key: CITIZEN_REFRESH_TOKEN_EXPIRES_DAYS
        value: "30"
      - key: ADMIN_REFRESH_TOKEN_EXPIRES_DAYS
        value: "7"
      - key: OTP_EXPIRES_MINUTES
        value: "5"
      - key: OTP_LENGTH
        value: "6"
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_PATH
        value: ./storage
      - key: STORAGE_PUBLIC_BASE_URL
        value: https://cybersave-l972.onrender.com/api/v1/storage/local
      - key: CORS_ORIGINS
        value: "*"
      - key: SWAGGER_ENABLED
        value: "true"
      - key: SMS_PROVIDER
        value: console
      - key: PAYMENT_PROVIDER
        value: mock
      - key: SKIP_PAYMENT_VERIFICATION
        value: "true"
      - key: BBPS_PROVIDER
        value: mock
      - key: BBPS_CONVENIENCE_FEE_FLAT
        value: "5"

  - type: web
    name: cybersave-web
    runtime: static
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        # Your live API — change only if the API URL changes
        value: https://cybersave-l972.onrender.com/api/v1
      - key: VITE_APP_NAME
        value: Cybersave
