# Cybersave API on Render (Blueprint)
# Native Node runtime (more reliable on free tier than Docker).
#
# IMPORTANT: Create a free Postgres on https://neon.tech first,
# then set DATABASE_URL in the Render dashboard after Blueprint creates the service
# (or paste it during Blueprint review if prompted).

services:
  - type: web
    name: cybersave-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev so Nest CLI / types are available at build time on Render
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: node scripts/start-render.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: API_PREFIX
        value: api/v1
      - key: AUTO_SEED
        value: "true"
      # Paste your Neon connection string in Render dashboard after create:
      # DATABASE_URL=postgresql://...
      - key: CITIZEN_JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: CITIZEN_JWT_EXPIRES_IN
        value: 15m
      - key: ADMIN_JWT_EXPIRES_IN
        value: 15m
      - key: CITIZEN_JWT_AUDIENCE
        value: cybersave-mobile
      - key: ADMIN_JWT_AUDIENCE
        value: cybersave-admin
      - key: CITIZEN_REFRESH_TOKEN_EXPIRES_DAYS
        value: "30"
      - key: ADMIN_REFRESH_TOKEN_EXPIRES_DAYS
        value: "7"
      - key: OTP_EXPIRES_MINUTES
        value: "5"
      - key: OTP_LENGTH
        value: "6"
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_PATH
        value: ./storage
      - key: CORS_ORIGINS
        value: "*"
      - key: SWAGGER_ENABLED
        value: "true"
      - key: SMS_PROVIDER
        value: console
      - key: PAYMENT_PROVIDER
        value: mock
      - key: SKIP_PAYMENT_VERIFICATION
        value: "true"
      - key: BBPS_PROVIDER
        value: mock
      - key: BBPS_CONVENIENCE_FEE_FLAT
        value: "5"
