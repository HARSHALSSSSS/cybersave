services:
  postgres:
    image: postgres:16-alpine
    container_name: cybersave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cybersave
      POSTGRES_PASSWORD: cybersave
      POSTGRES_DB: cybersave
    ports:
      - '5432:5432'
    volumes:
      - cybersave_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cybersave -d cybersave']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cybersave-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - cybersave_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cybersave_pg_data:
  cybersave_redis_data:
